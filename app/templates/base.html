<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Barbershop Queue{% endblock %}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.5rem; }
    form { display: flex; flex-direction: column; gap: 0.75rem; max-width: 360px; }
    input { padding: 0.5rem; font-size: 1rem; }
    button { padding: 0.6rem; font-size: 1rem; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; }
    .status { text-transform: capitalize; }
    nav a { margin-right: 1rem; }
    #shop-status-banner {
      padding: 0.6rem 1rem;
      border-radius: 6px;
      font-weight: 600;
      margin-bottom: 1rem;
      display: none;
    }
    #shop-status-banner.open { display: block; background: #e6f4ea; color: #1e7e34; }
    #shop-status-banner.closed { display: block; background: #fde8e8; color: #b02a2a; }
  </style>
</head>
<body>
  <nav>
    <a href="/">Check-in</a>
    <a href="/dashboard">Staff Dashboard</a>
  </nav>
  <div id="shop-status-banner"></div>
  {% block content %}{% endblock %}
  <script>
    async function loadShopStatusBanner() {
      try {
        const res = await fetch("/admin/shop-status");
        const data = await res.json();
        const banner = document.getElementById("shop-status-banner");
        banner.textContent = data.is_open ? "Shop is open" : "Shop is closed";
        banner.className = data.is_open ? "open" : "closed";
      } catch (e) {
        // ignore
      }
    }
    loadShopStatusBanner();
    setInterval(loadShopStatusBanner, 5000);
  </script>
</body>
</html>
