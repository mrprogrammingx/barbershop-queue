{% extends "base.html" %}
{% block title %}Customers{% endblock %}
{% block content %}
  <h1>Customers</h1>

  <div>
    <label for="customers-date-picker">Date:</label>
    <input type="date" id="customers-date-picker">
    <button id="clear-date-filter" type="button">Show All</button>
  </div>
  <p id="filter-hint" class="hint">Showing all customers. Pick a date to see only who's booked that day.</p>

  <table>
    <thead>
      <tr><th>Name</th><th>Phone</th><th>Visits</th><th>Signed Up</th></tr>
    </thead>
    <tbody id="customers-body"></tbody>
  </table>
  <p id="empty-message" style="display: none;">No customers found.</p>

  <style>
    .hint { font-size: 0.9rem; color: #666; max-width: 480px; }
  </style>

  <script>
    async function loadCustomers() {
      const selectedDate = document.getElementById("customers-date-picker").value;
      const hint = document.getElementById("filter-hint");
      const url = selectedDate ? `/queue/customers?for_date=${selectedDate}` : "/queue/customers";
      hint.textContent = selectedDate
        ? `Showing customers booked on ${selectedDate}.`
        : "Showing all customers. Pick a date to see only who's booked that day.";

      const res = await fetch(url);
      const customers = await res.json();
      const body = document.getElementById("customers-body");
      const emptyMessage = document.getElementById("empty-message");
      body.innerHTML = "";
      emptyMessage.style.display = customers.length === 0 ? "block" : "none";
      for (const customer of customers) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${customer.name}</td>
          <td>${customer.phone}</td>
          <td>${customer.visit_count}</td>
          <td>${new Date(customer.created_at).toLocaleDateString()}</td>
        `;
        body.appendChild(tr);
      }
    }

    document.getElementById("customers-date-picker").addEventListener("change", loadCustomers);
    document.getElementById("clear-date-filter").addEventListener("click", () => {
      document.getElementById("customers-date-picker").value = "";
      loadCustomers();
    });

    loadCustomers();
  </script>
{% endblock %}
