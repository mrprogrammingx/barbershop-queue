{% extends "base.html" %}
{% block title %}Staff Dashboard{% endblock %}
{% block content %}
  <h1>Staff Dashboard</h1>

  <div>
    <button id="call-next">Call Next</button>
    <button id="toggle-shop">Toggle Shop Open/Closed</button>
    <button id="reset-queue">Reset Queue</button>
  </div>

  <h2>Shop Hours</h2>
  <form id="hours-form">
    <input type="text" id="hours-input" placeholder="e.g. Mon-Fri 9am-6pm, Sat 10am-4pm, Sun closed">
    <button type="submit">Save Hours</button>
  </form>

  <h2>Appointment Slots</h2>
  <form id="schedule-form">
    <label>Open <input type="time" id="open-time-input" required></label>
    <label>Close <input type="time" id="close-time-input" required></label>
    <label>Slot length (minutes) <input type="number" id="slot-duration-input" min="5" step="5" required></label>
    <label>Capacity per slot <input type="number" id="capacity-input" min="1" step="1" required></label>
    <button type="submit">Save Slot Settings</button>
  </form>

  <table>
    <thead>
      <tr><th>#</th><th>Time</th><th>Name</th><th>Phone</th><th>Note</th><th>Status</th><th>Actions</th></tr>
    </thead>
    <tbody id="queue-body"></tbody>
  </table>

  <script>
    async function loadQueue() {
      if (document.activeElement && document.activeElement.classList.contains("note-input")) {
        return;
      }
      const res = await fetch("/queue");
      const entries = await res.json();
      const body = document.getElementById("queue-body");
      body.innerHTML = "";
      for (const entry of entries) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${entry.position}</td>
          <td>${entry.appointment_time.slice(0, 5)}</td>
          <td>${entry.customer.name}</td>
          <td>${entry.customer.phone}</td>
          <td><input type="text" class="note-input" data-id="${entry.id}" placeholder="Note"></td>
          <td class="status">${entry.status}</td>
          <td>
            <button data-id="${entry.id}" class="done-btn">Done</button>
            <button data-id="${entry.id}" class="noshow-btn">No-show</button>
          </td>
        `;
        tr.querySelector(".note-input").value = entry.note || "";
        body.appendChild(tr);
      }
      document.querySelectorAll(".done-btn").forEach(btn =>
        btn.addEventListener("click", () => updateEntry(btn.dataset.id, "done"))
      );
      document.querySelectorAll(".noshow-btn").forEach(btn =>
        btn.addEventListener("click", () => updateEntry(btn.dataset.id, "no-show"))
      );
      document.querySelectorAll(".note-input").forEach(input =>
        input.addEventListener("blur", () => saveNote(input.dataset.id, input.value))
      );
    }

    async function saveNote(id, note) {
      await fetch(`/queue/${id}/note`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ note: note || null }),
      });
    }

    async function updateEntry(id, action) {
      await fetch(`/queue/${id}/${action}`, { method: "POST" });
      loadQueue();
    }

    document.getElementById("call-next").addEventListener("click", async () => {
      await fetch("/queue/call-next", { method: "POST" });
      loadQueue();
    });

    document.getElementById("toggle-shop").addEventListener("click", async () => {
      const res = await fetch("/admin/shop-status");
      const status = await res.json();
      await fetch("/admin/shop-status", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ is_open: !status.is_open }),
      });
      alert(`Shop is now ${!status.is_open ? "open" : "closed"}`);
    });

    document.getElementById("reset-queue").addEventListener("click", async () => {
      if (confirm("Reset today's queue?")) {
        await fetch("/admin/reset-queue", { method: "POST" });
        loadQueue();
      }
    });

    async function loadHours() {
      const res = await fetch("/admin/shop-status");
      const status = await res.json();
      document.getElementById("hours-input").value = status.hours || "";
    }

    document.getElementById("hours-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const hours = document.getElementById("hours-input").value;
      await fetch("/admin/hours", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ hours }),
      });
    });

    async function loadScheduleSettings() {
      const res = await fetch("/admin/shop-status");
      const status = await res.json();
      document.getElementById("open-time-input").value = status.open_time.slice(0, 5);
      document.getElementById("close-time-input").value = status.close_time.slice(0, 5);
      document.getElementById("slot-duration-input").value = status.slot_duration_minutes;
      document.getElementById("capacity-input").value = status.capacity_per_slot;
    }

    document.getElementById("schedule-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      await fetch("/admin/schedule-settings", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          open_time: document.getElementById("open-time-input").value,
          close_time: document.getElementById("close-time-input").value,
          slot_duration_minutes: parseInt(document.getElementById("slot-duration-input").value, 10),
          capacity_per_slot: parseInt(document.getElementById("capacity-input").value, 10),
        }),
      });
      alert("Slot settings saved.");
    });

    loadQueue();
    loadHours();
    loadScheduleSettings();
    setInterval(loadQueue, 5000);
  </script>
{% endblock %}
