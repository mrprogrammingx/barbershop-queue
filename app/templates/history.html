{% extends "base.html" %}
{% block title %}Queue History{% endblock %}
{% block content %}
  <h1>Queue History</h1>

  <div>
    <label for="date-picker">Date:</label>
    <input type="date" id="date-picker">
  </div>
  <p id="available-dates"></p>

  <table>
    <thead>
      <tr><th>#</th><th>Time</th><th>Name</th><th>Phone</th><th>Note</th><th>Status</th><th>Checked In</th></tr>
    </thead>
    <tbody id="history-body"></tbody>
  </table>
  <p id="empty-message" style="display: none;">No queue entries for this date.</p>

  <script>
    function todayIso() {
      return new Date().toISOString().slice(0, 10);
    }

    async function loadDates() {
      const res = await adminFetch("/queue/history/dates");
      const dates = await res.json();
      const picker = document.getElementById("date-picker");
      const availableDates = document.getElementById("available-dates");

      picker.value = todayIso();
      availableDates.textContent = dates.length > 0
        ? "Dates with history: " + dates.join(", ")
        : "No past queue history yet.";

      loadHistory(picker.value);
    }

    async function loadHistory(queueDate) {
      const res = await adminFetch(`/queue/history/${queueDate}`);
      const entries = await res.json();
      const body = document.getElementById("history-body");
      const emptyMessage = document.getElementById("empty-message");
      body.innerHTML = "";
      emptyMessage.style.display = entries.length === 0 ? "block" : "none";
      for (const entry of entries) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${entry.position}</td>
          <td>${entry.appointment_time.slice(0, 5)}</td>
          <td>${entry.customer.name}</td>
          <td>${entry.customer.phone}</td>
          <td class="note-cell"></td>
          <td class="status">${entry.status.replace("_", " ")}</td>
          <td>${new Date(entry.created_at).toLocaleTimeString()}</td>
        `;
        tr.querySelector(".note-cell").textContent = entry.note || "";
        body.appendChild(tr);
      }
    }

    document.getElementById("date-picker").addEventListener("change", (e) => {
      if (e.target.value) {
        loadHistory(e.target.value);
      }
    });

    loadDates();
  </script>
{% endblock %}
