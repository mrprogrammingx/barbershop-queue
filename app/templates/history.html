{% extends "base.html" %}
{% block title %}Queue History{% endblock %}
{% block content %}
  <h1>Queue History</h1>

  <div>
    <label for="date-picker">Date:</label>
    <input type="date" id="date-picker">
  </div>
  <p id="available-dates"></p>

  <table>
    <thead>
      <tr><th>#</th><th>Name</th><th>Phone</th><th>Status</th><th>Checked In</th></tr>
    </thead>
    <tbody id="history-body"></tbody>
  </table>
  <p id="empty-message" style="display: none;">No queue entries for this date.</p>

  <script>
    async function loadDates() {
      const res = await fetch("/queue/history/dates");
      const dates = await res.json();
      const picker = document.getElementById("date-picker");
      const availableDates = document.getElementById("available-dates");

      if (dates.length > 0) {
        picker.value = dates[0];
        availableDates.textContent = "Dates with history: " + dates.join(", ");
        loadHistory(dates[0]);
      } else {
        picker.value = new Date().toISOString().slice(0, 10);
        availableDates.textContent = "No past queue history yet.";
        document.getElementById("empty-message").style.display = "block";
      }
    }

    async function loadHistory(queueDate) {
      const res = await fetch(`/queue/history/${queueDate}`);
      const entries = await res.json();
      const body = document.getElementById("history-body");
      const emptyMessage = document.getElementById("empty-message");
      body.innerHTML = "";
      emptyMessage.style.display = entries.length === 0 ? "block" : "none";
      for (const entry of entries) {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${entry.position}</td>
          <td>${entry.customer.name}</td>
          <td>${entry.customer.phone}</td>
          <td class="status">${entry.status}</td>
          <td>${new Date(entry.created_at).toLocaleTimeString()}</td>
        `;
        body.appendChild(tr);
      }
    }

    document.getElementById("date-picker").addEventListener("change", (e) => {
      if (e.target.value) {
        loadHistory(e.target.value);
      }
    });

    loadDates();
  </script>
{% endblock %}
